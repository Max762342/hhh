<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Willkommen</title>
    <!-- Tailwind CSS für modernes Design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darker: '#0f172a',
                        card: '#1e293b'
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-darker text-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- ANSICHT 1: Server nicht verfügbar (Wenn ngrok offline ist) -->
    <div id="offline-view" class="w-full max-w-md bg-card border border-slate-800 p-8 rounded-2xl shadow-2xl text-center transition-all duration-300">
        <div class="relative w-20 h-20 mx-auto mb-6 flex items-center justify-center bg-rose-500/10 rounded-full border border-rose-500/20">
            <span class="absolute w-full h-full rounded-full bg-rose-500/20 animate-ping"></span>
            <svg class="w-10 h-10 text-rose-500 relative z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-12.728 12.728m0-12.728l12.728 12.728"></path>
            </svg>
        </div>
        <h1 class="text-2xl font-bold tracking-tight mb-2">Dieser Server ist derzeit nicht verfügbar</h1>
        <p class="text-slate-400 text-sm mb-6">Bitte versuche es später noch einmal.</p>
        
        <div class="inline-flex items-center space-x-2 bg-slate-900/60 border border-slate-800 px-4 py-2 rounded-full text-xs text-slate-400">
            <span class="w-2 h-2 rounded-full bg-rose-500 animate-pulse"></span>
            <span id="status-text">Prüfe Verbindung...</span>
        </div>
    </div>

    <!-- ANSICHT 2: Etwas Völlig Anderes (Wird angezeigt, wenn ngrok erreichbar ist) -->
    <div id="online-view" class="hidden w-full max-w-xl bg-card border border-slate-800 p-8 rounded-2xl shadow-2xl transition-all duration-300 text-center">
        <!-- Avatar / Logo -->
        <div class="w-24 h-24 mx-auto mb-4 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-500 p-1 shadow-lg">
            <div class="w-full h-full bg-slate-900 rounded-full flex items-center justify-center text-3xl font-bold text-white">
                🚀
            </div>
        </div>

        <h1 class="text-2xl font-bold tracking-tight mb-1">Willkommen auf meiner Seite!</h1>
        <p class="text-slate-400 text-sm mb-8">Hier entsteht etwas Großartiges. Schau dich gerne um.</p>

        <!-- Beispiel-Links oder Inhalte -->
        <div class="space-y-3">
            <a href="https://github.com" target="_blank" class="block w-full bg-slate-900/60 hover:bg-slate-900 border border-slate-800 hover:border-slate-700 p-4 rounded-xl font-medium transition-all text-sm flex items-center justify-between">
                <span>GitHub Profil</span>
                <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </a>
            <a href="https://discord.com" target="_blank" class="block w-full bg-slate-900/60 hover:bg-slate-900 border border-slate-800 hover:border-slate-700 p-4 rounded-xl font-medium transition-all text-sm flex items-center justify-between">
                <span>Discord Community</span>
                <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </a>
        </div>

        <div class="mt-8 text-xs text-slate-500">
            Verbindung aktiv via ngrok
        </div>
    </div>

    <!-- JavaScript Logik -->
    <script>
        const targetUrl = "https://tableful-lustfully-dash.ngrok-free.dev";
        const offlineView = document.getElementById('offline-view');
        const onlineView = document.getElementById('online-view');
        const statusText = document.getElementById('status-text');

        let isOnline = false;

        async function checkServerStatus() {
            try {
                await fetch(targetUrl, { mode: 'no-cors', cache: 'no-store' });
                setOnlineState();
            } catch (error) {
                setOfflineState();
            }
        }

        function setOnlineState() {
            if (!isOnline) {
                isOnline = true;
                offlineView.classList.add('hidden');
                onlineView.classList.remove('hidden');
            }
        }

        function setOfflineState() {
            if (isOnline) {
                isOnline = false;
                onlineView.classList.add('hidden');
                offlineView.classList.remove('hidden');
            }
            statusText.textContent = "Server offline. Nächster Versuch...";
        }

        // Direkt prüfen und alle 3 Sekunden wiederholen
        checkServerStatus();
        setInterval(checkServerStatus, 3000);
    </script>
</body>
</html>
