<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>808 • Wartungsarbeiten / Maintenance</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Externe CSS-Datei -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Animierter Hintergrund -->
    <div class="ambient-background">
        <div class="light-shape"></div>
    </div>

    <!-- Oben Links: Logo / 808 Badge -->
    <div class="top-left">
        <div class="brand-badge">
            <span class="dot"></span>
            <span>808</span>
        </div>
    </div>

    <!-- Oben Rechts: Sprachumschalter (DE / ENG) -->
    <div class="top-right">
        <div class="lang-switch">
            <button id="btn-de" class="lang-btn active" onclick="setLanguage('de')">DE</button>
            <button id="btn-en" class="lang-btn" onclick="setLanguage('en')">EN</button>
        </div>
    </div>

    <!-- Hauptinhalt in der Mitte -->
    <div class="content-card">
        <div class="status-pill" data-key="status">Wartungsarbeiten • Maintenance</div>
        
        <h1 data-key="title">808 Service ist derzeit in Wartungsarbeiten</h1>
        
        <p class="description" data-key="desc">
            Wir führen gerade planmäßige Systemupdates durch, um unsere Dienste für Sie zu verbessern. Wir sind in Kürze wieder da.
        </p>

        <div class="button-group">
            <button class="btn btn-primary" id="retryBtn" onclick="handleRetry()">
                <span data-key="btnRetry">Erneut versuchen</span>
            </button>
            <a href="mailto:support@808.internal" class="btn btn-secondary">
                <span data-key="btnSupport">Support kontaktieren</span>
            </a>
        </div>
    </div>

    <!-- JavaScript für Sprachwechsel und Ladeanimation -->
    <script>
        const translations = {
            de: {
                status: "Wartungsarbeiten • Maintenance",
                title: "808 Service ist derzeit in Wartungsarbeiten",
                desc: "Wir führen gerade planmäßige Systemupdates durch, um unsere Dienste für Sie zu verbessern. Wir sind in Kürze wieder da.",
                btnRetry: "Erneut versuchen",
                btnSupport: "Support kontaktieren",
                connecting: "Verbinde..."
            },
            en: {
                status: "Maintenance • 808 Service",
                title: "808 Service is currently undergoing maintenance",
                desc: "We are performing scheduled system updates to improve our services. We will be back online shortly.",
                btnRetry: "Try again",
                btnSupport: "Contact Support",
                connecting: "Connecting..."
            }
        };

        let currentLang = 'de';

        function setLanguage(lang) {
            currentLang = lang;
            document.documentElement.lang = lang;
            
            // Aktiven Button umschalten
            document.getElementById('btn-de').classList.toggle('active', lang === 'de');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');

            // Texte aktualisieren
            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.getAttribute('data-key');
                if (translations[lang][key]) {
                    el.innerText = translations[lang][key];
                }
            });
        }

        function handleRetry() {
            const btn = document.getElementById('retryBtn');
            const textSpan = btn.querySelector('span');
            btn.classList.add('is-loading');
            textSpan.innerText = translations[currentLang].connecting;
            
            setTimeout(() => {
                window.location.reload();
            }, 600);
        }
    </script>
</body>
</html>
