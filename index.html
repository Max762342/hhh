<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seite momentan nicht erreichbar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #030303;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Präziser, organischer Licht-Hintergrund aus dem Design */
        .ambient-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .light-shape {
            position: absolute;
            top: -20vh;
            left: -20vw;
            width: 80vw;
            height: 100vh;
            background: radial-gradient(ellipse at 20% 30%, rgba(70, 70, 80, 0.28) 0%, rgba(20, 20, 25, 0.08) 50%, transparent 75%);
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            filter: blur(50px);
            animation: morphAndMove 14s ease-in-out infinite alternate;
        }

        @keyframes morphAndMove {
            0% {
                transform: translate(0px, 0px) scale(1) rotate(0deg);
                border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            }
            50% {
                transform: translate(40px, 30px) scale(1.05) rotate(3deg);
                border-radius: 50% 50% 50% 50% / 60% 40% 60% 40%;
            }
            100% {
                transform: translate(-20px, 50px) scale(0.96) rotate(-2deg);
                border-radius: 35% 65% 60% 40% / 50% 60% 40% 50%;
            }
        }

        /* Inhalt im Vordergrund */
        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
            padding: 20px;
        }

        h1 {
            font-size: 1.65rem;
            font-weight: 400;
            letter-spacing: -0.01em;
            color: #ededef;
        }

        .btn {
            background-color: rgba(255, 255, 255, 0.06);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 22px;
            font-size: 0.88rem;
            font-weight: 400;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }

        .btn:hover {
            background-color: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.22);
        }

        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <!-- Animierter Hintergrund -->
    <div class="ambient-background">
        <div class="light-shape"></div>
    </div>

    <!-- Minimalistischer Text & Button -->
    <div class="content">
        <h1>Seite momentan nicht erreichbar</h1>
        <a href="javascript:window.location.reload();" class="btn">Erneut versuchen</a>
    </div>

</body>
</html>
